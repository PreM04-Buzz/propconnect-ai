name: Deploy frontend to GitHub Pages

# Builds the React app and publishes it to https://<owner>.github.io/propconnect-ai/
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions",
# and Settings → Secrets and variables → Actions → Variables → API_URL = your Render URL.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Check the API address is set
        run: test -n "${{ vars.API_URL }}" || (echo "::error::Set the API_URL repository variable to your Render URL" && exit 1)
      # GitHub Pages serves 404.html for unknown paths; a copy of the app lets
      # links like /propconnect-ai/clients/12 work after a refresh.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
