name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: propconnect
          POSTGRES_PASSWORD: propconnect
          POSTGRES_DB: propconnect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U propconnect" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://propconnect:propconnect@localhost:5432/propconnect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: pytest -q
      - name: Migrations apply cleanly on real Postgres (up, down, up)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Migrations match the models
        run: alembic check
      - name: OpenAPI schema is committed and current
        run: |
          python -m app.scripts.export_openapi
          git diff --exit-code openapi.json || (echo "::error::Run 'python -m app.scripts.export_openapi' and commit backend/openapi.json" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "::error::Run 'npm run gen:api' and commit src/api/schema.d.ts" && exit 1)
      - name: Type-check and build
        run: npm run build
