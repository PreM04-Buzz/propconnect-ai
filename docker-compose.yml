services:
  db:
    image: postgres:16
    container_name: propconnect-db
    environment:
      POSTGRES_USER: propconnect
      POSTGRES_PASSWORD: propconnect
      POSTGRES_DB: propconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propconnect"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
